[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logisim-forge"
version = "0.1.0"
description = "Build Logisim circuits from code, and verify them with Logisim itself."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Keke" }]
keywords = ["logisim", "mcp", "eda", "digital-logic", "circuit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
logisim-forge = "logisim_forge.__main__:main"

[tool.setuptools]
packages = ["logisim_forge"]
